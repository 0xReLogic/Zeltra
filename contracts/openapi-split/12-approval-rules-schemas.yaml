components:
  schemas:
    ApprovalRuleResponse:
      description: Response for an approval rule.
      properties:
        created_at:
          description: Created at timestamp.
          example: 2024-01-15 10:30:00+00:00
          format: date-time
          type: string
        description:
          description: Description.
          type: string
          nullable: true
        id:
          description: Rule ID.
          format: uuid
          type: string
        is_active:
          description: Active status.
          type: boolean
        max_amount:
          description: Maximum amount threshold (must be a valid decimal with up to
            2 decimal places).
          example: '5000.00'
          pattern: ^[0-9]+(\.[0-9]{1,2})?$
          type: string
          nullable: true
        min_amount:
          description: Minimum amount threshold (must be a valid decimal with up to
            2 decimal places).
          example: '1000.00'
          pattern: ^[0-9]+(\.[0-9]{1,2})?$
          type: string
          nullable: true
        name:
          description: Name.
          type: string
        organization_id:
          description: Organization ID.
          format: uuid
          type: string
        priority:
          description: Priority.
          format: int32
          type: integer
        required_role:
          description: 'Required role (valid values: viewer, submitter, approver,
            accountant, admin, owner).'
          example: approver
          type: string
        transaction_types:
          description: 'Transaction types (valid values: journal, invoice, bill, payment,
            expense, transfer, adjustment, opening_balance, reversal, accrual, revaluation,
            intercompany).'
          example:
          - bill
          - invoice
          items:
            type: string
          type: array
        updated_at:
          description: Updated at timestamp.
          example: 2024-01-15 10:30:00+00:00
          format: date-time
          type: string
      required:
      - id
      - organization_id
      - name
      - transaction_types
      - required_role
      - priority
      - is_active
      - created_at
      - updated_at
      type: object
    CreateApprovalRuleRequest:
      description: Request body for creating an approval rule.
      properties:
        description:
          description: Optional description (max 1000 characters).
          maxLength: 1000
          type: string
          nullable: true
        max_amount:
          description: Maximum amount threshold (inclusive, must be a valid decimal
            with up to 2 decimal places).
          example: '5000.00'
          pattern: ^[0-9]+(\.[0-9]{1,2})?$
          type: string
          nullable: true
        min_amount:
          description: Minimum amount threshold (inclusive, must be a valid decimal
            with up to 2 decimal places).
          example: '1000.00'
          pattern: ^[0-9]+(\.[0-9]{1,2})?$
          type: string
          nullable: true
        name:
          description: Name of the approval rule (1-255 characters).
          example: High Value Bills
          maxLength: 255
          minLength: 1
          type: string
        priority:
          description: 'Priority (lower = higher priority, valid range: 1-100).'
          example: 1
          format: int32
          maximum: 100
          minimum: 1
          type: integer
        required_role:
          description: 'Required role to approve (valid values: viewer, submitter,
            approver, accountant, admin, owner).'
          example: approver
          type: string
        transaction_types:
          description: 'Transaction types this rule applies to (valid values: journal,
            invoice, bill, payment, expense, transfer, adjustment, opening_balance,
            reversal, accrual, revaluation, intercompany).'
          example:
          - bill
          - invoice
          items:
            type: string
          type: array
      required:
      - name
      - transaction_types
      - required_role
      - priority
      type: object
    UpdateApprovalRuleRequest:
      description: Request body for updating an approval rule.
      properties:
        description:
          description: New description (max 1000 characters).
          maxLength: 1000
          type: string
          nullable: true
        is_active:
          description: Active status.
          type: boolean
          nullable: true
        max_amount:
          description: New maximum amount (must be a valid decimal with up to 2 decimal
            places).
          example: '5000.00'
          pattern: ^[0-9]+(\.[0-9]{1,2})?$
          type: string
          nullable: true
        min_amount:
          description: New minimum amount (must be a valid decimal with up to 2 decimal
            places).
          example: '1000.00'
          pattern: ^[0-9]+(\.[0-9]{1,2})?$
          type: string
          nullable: true
        name:
          description: New name (1-255 characters).
          maxLength: 255
          minLength: 1
          type: string
          nullable: true
        priority:
          description: 'New priority (valid range: 1-100).'
          format: int32
          maximum: 100
          minimum: 1
          type: integer
          nullable: true
        required_role:
          description: 'New required role (valid values: viewer, submitter, approver,
            accountant, admin, owner).'
          example: approver
          type: string
          nullable: true
        transaction_types:
          description: 'New transaction types (valid values: journal, invoice, bill,
            payment, expense, transfer, adjustment, opening_balance, reversal, accrual,
            revaluation, intercompany).'
          example:
          - bill
          - invoice
          items:
            type: string
          type: array
          nullable: true
      type: object
