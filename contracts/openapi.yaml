components:
  schemas:
    AccountBalanceResponse:
      description: Account balance in response.
      properties:
        account_id:
          description: Account ID.
          format: uuid
          type: string
        account_type:
          description: Account type.
          example: asset
          type: string
        balance:
          description: Balance.
          type: string
        code:
          description: Account code.
          example: '1001'
          type: string
        credit:
          description: Credit amount.
          type: string
        debit:
          description: Debit amount.
          type: string
        name:
          description: Account name.
          example: Main Bank Account
          type: string
      required:
      - account_id
      - code
      - name
      - account_type
      - debit
      - credit
      - balance
      type: object
    AccountLedgerResponse:
      description: Response for account ledger.
      properties:
        account_id:
          description: Account ID.
          format: uuid
          type: string
        code:
          description: Account code.
          example: '1001'
          type: string
        entries:
          description: Entries.
          items:
            $ref: '#/components/schemas/LedgerEntryResponse'
          type: array
        name:
          description: Account name.
          example: Main Bank Account
          type: string
        pagination:
          $ref: '#/components/schemas/PaginationResponse'
          description: Pagination.
      required:
      - account_id
      - code
      - name
      - entries
      - pagination
      type: object
    AccountProjectionResponse:
      description: Account projection response.
      properties:
        account_code:
          description: Account code.
          type: string
        account_id:
          description: Account ID.
          format: uuid
          type: string
        account_name:
          description: Account name.
          type: string
        account_type:
          description: Account type.
          type: string
        baseline_amount:
          description: Average monthly amount from historical period.
          type: string
        change_percent:
          description: Percentage change from baseline.
          type: string
        period_end:
          description: Period end date.
          type: string
        period_name:
          description: Period identifier (YYYY-MM format).
          example: 2024-01
          type: string
        period_start:
          description: Period start date.
          type: string
        projected_amount:
          description: Projected amount after applying growth rate.
          type: string
      required:
      - period_name
      - period_start
      - period_end
      - account_id
      - account_code
      - account_name
      - account_type
      - baseline_amount
      - projected_amount
      - change_percent
      type: object
    AccountResponse:
      description: Response for an account.
      properties:
        allow_direct_posting:
          description: Whether direct posting is allowed.
          type: boolean
        balance:
          description: Current balance.
          type: string
        code:
          description: Account code.
          type: string
        currency:
          description: Currency code.
          type: string
        description:
          description: Account description.
          type:
          - string
          - 'null'
        id:
          description: Account ID.
          format: uuid
          type: string
        is_active:
          description: Whether the account is active.
          type: boolean
        name:
          description: Account name.
          type: string
        parent_id:
          description: Parent account ID.
          format: uuid
          type:
          - string
          - 'null'
        subtype:
          description: Account subtype.
          type:
          - string
          - 'null'
        type:
          description: Account type.
          type: string
      required:
      - id
      - code
      - name
      - type
      - currency
      - balance
      - is_active
      - allow_direct_posting
      type: object
    ActivityItemResponse:
      description: Activity item response.
      properties:
        action:
          description: Action performed.
          example: create
          type: string
        amount:
          description: Amount (if applicable).
          type:
          - string
          - 'null'
        currency:
          description: Currency (if applicable).
          type:
          - string
          - 'null'
        description:
          description: Description.
          example: New transaction created for 120.00 USD
          type: string
        entity_id:
          description: Entity ID.
          format: uuid
          type: string
        entity_type:
          description: Entity type.
          example: transaction
          type: string
        id:
          description: Activity ID.
          format: uuid
          type: string
        timestamp:
          description: Timestamp.
          type: string
        type:
          description: Activity type.
          example: transaction_create
          type: string
        user:
          $ref: '#/components/schemas/UserInfo'
          description: User info.
      required:
      - id
      - type
      - action
      - entity_type
      - entity_id
      - description
      - user
      - timestamp
      type: object
    AddUserRequest:
      description: Add user to organization request.
      properties:
        approval_limit:
          description: Approval limit (for approver role).
          type:
          - string
          - 'null'
        email:
          description: User email to add.
          type: string
        role:
          description: Role to assign.
          type: string
      required:
      - email
      - role
      type: object
    AnnualSummaryResponse:
      description: Annual summary response.
      properties:
        net_profit_margin:
          description: Net income / Revenue * 100.
          type: string
        projected_net_income:
          description: Revenue minus expenses.
          type: string
        total_projected_expenses:
          description: Sum of all projected expense amounts.
          type: string
        total_projected_revenue:
          description: Sum of all projected revenue amounts.
          type: string
      required:
      - total_projected_revenue
      - total_projected_expenses
      - projected_net_income
      - net_profit_margin
      type: object
    ApiError:
      description: Standard API error response.
      properties:
        details:
          description: Additional error details.
        error:
          description: Error code (e.g., "validation_error", "not_found").
          example: not_found
          type: string
        message:
          description: Human-readable error message.
          example: Resource not found
          type: string
        request_id:
          description: Request ID for tracing.
          type:
          - string
          - 'null'
      required:
      - error
      - message
      type: object
    ApprovalRuleResponse:
      description: Response for an approval rule.
      properties:
        created_at:
          description: Created at timestamp.
          type: string
        description:
          description: Description.
          type:
          - string
          - 'null'
        id:
          description: Rule ID.
          format: uuid
          type: string
        is_active:
          description: Active status.
          type: boolean
        max_amount:
          description: Maximum amount threshold.
          type:
          - string
          - 'null'
        min_amount:
          description: Minimum amount threshold.
          type:
          - string
          - 'null'
        name:
          description: Name.
          type: string
        organization_id:
          description: Organization ID.
          format: uuid
          type: string
        priority:
          description: Priority.
          format: int32
          type: integer
        required_role:
          description: Required role.
          type: string
        transaction_types:
          description: Transaction types.
          items:
            type: string
          type: array
        updated_at:
          description: Updated at timestamp.
          type: string
      required:
      - id
      - organization_id
      - name
      - transaction_types
      - required_role
      - priority
      - is_active
      - created_at
      - updated_at
      type: object
    ApproveRequest:
      description: Request body for approving a transaction.
      properties:
        approval_notes:
          description: Optional approval notes.
          type:
          - string
          - 'null'
      type: object
    AttachmentResponse:
      description: Response for an attachment.
      properties:
        attachment_type:
          description: Attachment type.
          example: invoice
          type: string
        created_at:
          description: Created at timestamp (ISO 8601).
          type: string
        download_url:
          description: Download URL (presigned, optional).
          type:
          - string
          - 'null'
        download_url_expires_at:
          description: Download URL expiration (ISO 8601, optional).
          type:
          - string
          - 'null'
        file_size:
          description: File size in bytes.
          example: 1024
          format: int64
          type: integer
        filename:
          description: Original filename.
          example: invoice.pdf
          type: string
        id:
          description: Attachment ID.
          format: uuid
          type: string
        mime_type:
          description: MIME type.
          example: application/pdf
          type: string
        storage_provider:
          description: Storage provider.
          example: s3
          type: string
        transaction_id:
          description: Transaction ID.
          format: uuid
          type:
          - string
          - 'null'
        uploaded_by:
          description: Uploaded by user ID.
          format: uuid
          type: string
      required:
      - id
      - attachment_type
      - filename
      - file_size
      - mime_type
      - storage_provider
      - uploaded_by
      - created_at
      type: object
    BalanceSheetResponse:
      description: Response for balance sheet report.
      properties:
        as_of:
          description: As of date.
          type: string
        assets:
          $ref: '#/components/schemas/BalanceSheetSectionResponse'
          description: Assets section.
        currency:
          description: Currency.
          type: string
        equity:
          $ref: '#/components/schemas/BalanceSheetSectionResponse'
          description: Equity section.
        is_balanced:
          description: Whether balanced.
          type: boolean
        liabilities:
          $ref: '#/components/schemas/BalanceSheetSectionResponse'
          description: Liabilities section.
        report_type:
          description: Report type.
          example: balance_sheet
          type: string
        total_assets:
          description: Total assets.
          type: string
        total_liabilities_and_equity:
          description: Total liabilities and equity.
          type: string
      required:
      - report_type
      - as_of
      - currency
      - assets
      - liabilities
      - equity
      - total_assets
      - total_liabilities_and_equity
      - is_balanced
      type: object
    BalanceSheetSectionResponse:
      description: Balance sheet section response.
      properties:
        accounts:
          description: Section accounts.
          items:
            $ref: '#/components/schemas/AccountBalanceResponse'
          type: array
        total:
          description: Section total.
          type: string
      required:
      - accounts
      - total
      type: object
    BudgetLineInput:
      description: Input for a single budget line.
      properties:
        account_id:
          description: Account ID.
          format: uuid
          type: string
        amount:
          description: Budgeted amount.
          example: '5000.00'
          type: string
        dimensions:
          description: Dimension value IDs.
          items:
            format: uuid
            type: string
          type:
          - array
          - 'null'
        fiscal_period_id:
          description: Fiscal period ID.
          format: uuid
          type: string
        notes:
          description: Notes.
          type:
          - string
          - 'null'
      required:
      - account_id
      - fiscal_period_id
      - amount
      type: object
    BudgetLineItemResponse:
      description: Budget line item response.
      properties:
        account_code:
          description: Account code.
          example: '6001'
          type: string
        account_id:
          description: Account ID.
          format: uuid
          type: string
        account_name:
          description: Account name.
          example: Office Expenses
          type: string
        actual:
          description: Actual amount.
          type: string
        budgeted:
          description: Budgeted amount.
          type: string
        variance:
          description: Variance.
          type: string
        variance_percent:
          description: Variance percentage.
          format: double
          type: number
      required:
      - account_id
      - account_code
      - account_name
      - budgeted
      - actual
      - variance
      - variance_percent
      type: object
    BudgetResponse:
      description: Response for a budget.
      properties:
        budget_type:
          description: Budget type.
          type: string
        created_at:
          description: Created at timestamp.
          type: string
        currency:
          description: Currency.
          type: string
        description:
          description: Budget description.
          type:
          - string
          - 'null'
        fiscal_year_id:
          description: Fiscal year ID.
          format: uuid
          type: string
        fiscal_year_name:
          description: Fiscal year name.
          type: string
        id:
          description: Budget ID.
          format: uuid
          type: string
        is_active:
          description: Whether the budget is active.
          type: boolean
        is_locked:
          description: Whether the budget is locked.
          type: boolean
        name:
          description: Budget name.
          type: string
        total_budgeted:
          description: Total budgeted amount.
          type: string
        updated_at:
          description: Updated at timestamp.
          type: string
      required:
      - id
      - name
      - fiscal_year_id
      - fiscal_year_name
      - budget_type
      - currency
      - is_active
      - is_locked
      - total_budgeted
      - created_at
      - updated_at
      type: object
    BudgetSummary:
      description: Budget summary.
      properties:
        total_actual:
          description: Total actual.
          type: string
        total_budgeted:
          description: Total budgeted.
          type: string
        variance:
          description: Variance (budgeted - actual).
          type: string
        variance_percent:
          description: Variance percentage.
          format: double
          type: number
      required:
      - total_budgeted
      - total_actual
      - variance
      - variance_percent
      type: object
    BudgetVsActualResponse:
      description: Response for budget vs actual data.
      properties:
        budget_id:
          description: Budget ID.
          format: uuid
          type:
          - string
          - 'null'
        budget_name:
          description: Budget name.
          example: Annual Budget 2023
          type:
          - string
          - 'null'
        line_items:
          description: Line items.
          items:
            $ref: '#/components/schemas/BudgetLineItemResponse'
          type: array
        summary:
          $ref: '#/components/schemas/BudgetSummary'
          description: Summary.
      required:
      - summary
      - line_items
      type: object
    BulkApproveItemResponse:
      description: Response for a single bulk approval item.
      properties:
        error:
          description: Error message if failed.
          type:
          - string
          - 'null'
        success:
          description: Whether the approval succeeded.
          type: boolean
        transaction_id:
          description: Transaction ID.
          format: uuid
          type: string
      required:
      - transaction_id
      - success
      type: object
    BulkApproveRequest:
      description: Request body for bulk approval.
      properties:
        approval_notes:
          description: Optional approval notes.
          type:
          - string
          - 'null'
        transaction_ids:
          description: Transaction IDs to approve.
          items:
            format: uuid
            type: string
          type: array
      required:
      - transaction_ids
      type: object
    BulkApproveResponse:
      description: Response for bulk approval.
      properties:
        failure_count:
          description: Number of failed approvals.
          minimum: 0
          type: integer
        results:
          description: Results for each transaction.
          items:
            $ref: '#/components/schemas/BulkApproveItemResponse'
          type: array
        success_count:
          description: Number of successful approvals.
          minimum: 0
          type: integer
      required:
      - results
      - success_count
      - failure_count
      type: object
    BulkImportError:
      description: Error for a single rate in bulk import.
      properties:
        currency_pair:
          description: Currency pair.
          type: string
        index:
          description: Index of the rate in the input.
          minimum: 0
          type: integer
        message:
          description: Error message.
          type: string
      required:
      - index
      - currency_pair
      - message
      type: object
    BulkImportRequest:
      description: Request body for bulk rate import.
      properties:
        rates:
          description: Rates to import.
          items:
            $ref: '#/components/schemas/BulkRateItem'
          type: array
      required:
      - rates
      type: object
    BulkImportResponse:
      description: Response for bulk import operation.
      properties:
        errors:
          description: Validation errors for individual rates.
          items:
            $ref: '#/components/schemas/BulkImportError'
          type: array
        imported_count:
          description: Number of rates imported (new).
          minimum: 0
          type: integer
        updated_count:
          description: Number of rates updated (existing).
          minimum: 0
          type: integer
      required:
      - imported_count
      - updated_count
      type: object
    BulkRateItem:
      description: A single rate item for bulk import.
      properties:
        effective_date:
          description: Effective date.
          format: date
          type: string
        from_currency:
          description: Source currency code.
          type: string
        rate:
          description: Exchange rate (as string for precision).
          example: '1.0850'
          type: string
        to_currency:
          description: Target currency code.
          type: string
      required:
      - from_currency
      - to_currency
      - rate
      - effective_date
      type: object
    BurnRateResponse:
      description: Burn rate response.
      properties:
        daily:
          description: Daily burn rate.
          example: '100.0000'
          type: string
        monthly:
          description: Monthly burn rate.
          example: '3000.0000'
          type: string
      required:
      - daily
      - monthly
      type: object
    CashFlowDataPoint:
      description: Cash flow data point.
      properties:
        inflow:
          description: Total inflow.
          type: string
        month:
          description: Month label (e.g., "Jan").
          example: Jan
          type: string
        net:
          description: Net cash flow.
          type: string
        outflow:
          description: Total outflow.
          type: string
        period_name:
          description: Period name (e.g., "2026-01").
          example: 2026-01
          type: string
      required:
      - month
      - period_name
      - inflow
      - outflow
      - net
      type: object
    CashFlowResponse:
      description: Response for cash flow data.
      properties:
        data:
          description: Cash flow data points.
          items:
            $ref: '#/components/schemas/CashFlowDataPoint'
          type: array
      required:
      - data
      type: object
    CashPositionResponse:
      description: Cash position response.
      properties:
        balance:
          description: Current balance.
          example: '50000.0000'
          type: string
        change_from_last_period:
          description: Change from last period.
          example: '5000.0000'
          type: string
        change_percent:
          description: Change percentage.
          example: 11.11
          format: double
          type: number
        currency:
          description: Currency.
          example: USD
          type: string
      required:
      - balance
      - currency
      - change_from_last_period
      - change_percent
      type: object
    ConfirmUploadRequest:
      description: Request body for confirming an upload.
      properties:
        attachment_id:
          description: Attachment ID from request_upload.
          format: uuid
          type: string
        attachment_type:
          description: Attachment type classification.
          example: invoice
          type:
          - string
          - 'null'
        content_type:
          description: MIME type.
          example: application/pdf
          type: string
        file_size:
          description: File size in bytes.
          example: 1024
          format: int64
          type: integer
        filename:
          description: Original filename.
          example: invoice.pdf
          type: string
        storage_key:
          description: Storage key from request_upload.
          type: string
      required:
      - attachment_id
      - filename
      - content_type
      - file_size
      - storage_key
      type: object
    CreateAccountRequest:
      description: Request body for creating an account.
      properties:
        allow_direct_posting:
          description: 'Whether direct posting is allowed (default: true).'
          type:
          - boolean
          - 'null'
        code:
          description: Account code (must be unique within organization).
          example: '1000'
          type: string
        currency:
          description: Currency code.
          example: USD
          type: string
        description:
          description: Account description.
          type:
          - string
          - 'null'
        is_active:
          description: 'Whether the account is active (default: true).'
          type:
          - boolean
          - 'null'
        name:
          description: Account name.
          example: Petty Cash
          type: string
        parent_id:
          description: Parent account ID for hierarchical structure.
          format: uuid
          type:
          - string
          - 'null'
        subtype:
          description: Account subtype for more specific categorization.
          example: cash
          type:
          - string
          - 'null'
        type:
          description: 'Account type: asset, liability, equity, revenue, expense.'
          example: asset
          type: string
      required:
      - code
      - name
      - type
      - currency
      type: object
    CreateApprovalRuleRequest:
      description: Request body for creating an approval rule.
      properties:
        description:
          description: Optional description.
          type:
          - string
          - 'null'
        max_amount:
          description: Maximum amount threshold (inclusive).
          type:
          - string
          - 'null'
        min_amount:
          description: Minimum amount threshold (inclusive).
          example: '1000.00'
          type:
          - string
          - 'null'
        name:
          description: Name of the approval rule.
          example: High Value Bills
          type: string
        priority:
          description: Priority (lower = higher priority).
          example: 1
          format: int32
          type: integer
        required_role:
          description: Required role to approve (viewer, submitter, approver, accountant, admin, owner).
          example: approver
          type: string
        transaction_types:
          description: Transaction types this rule applies to.
          example: '["bill"]'
          items:
            type: string
          type: array
      required:
      - name
      - transaction_types
      - required_role
      - priority
      type: object
    CreateBudgetLinesRequest:
      description: Request body for creating budget lines in bulk.
      properties:
        lines:
          description: Budget lines to create.
          items:
            $ref: '#/components/schemas/BudgetLineInput'
          type: array
      required:
      - lines
      type: object
    CreateBudgetRequest:
      description: Request body for creating a budget.
      properties:
        budget_type:
          description: 'Budget type: annual, quarterly, monthly, project.'
          example: annual
          type: string
        description:
          description: Budget description.
          type:
          - string
          - 'null'
        fiscal_year_id:
          description: Fiscal year ID.
          format: uuid
          type: string
        name:
          description: Budget name.
          example: FY2026 Operations
          type: string
      required:
      - name
      - fiscal_year_id
      - budget_type
      type: object
    CreateDimensionTypeRequest:
      description: Request body for creating a dimension type.
      properties:
        code:
          description: Dimension type code (must be unique within organization).
          example: DEPT
          type: string
        description:
          description: Description.
          type:
          - string
          - 'null'
        is_active:
          description: 'Whether this dimension type is active (default: true).'
          type:
          - boolean
          - 'null'
        is_required:
          description: Whether this dimension is required on transactions.
          type:
          - boolean
          - 'null'
        name:
          description: Dimension type name.
          example: Department
          type: string
        sort_order:
          description: 'Sort order for display (default: 0).'
          format: int32
          type:
          - integer
          - 'null'
      required:
      - code
      - name
      type: object
    CreateDimensionValueRequest:
      description: Request body for creating a dimension value.
      properties:
        code:
          description: Dimension value code (must be unique within type).
          example: MARKETING
          type: string
        description:
          description: Description.
          type:
          - string
          - 'null'
        dimension_type_id:
          description: Dimension type ID.
          format: uuid
          type: string
        effective_from:
          description: Effective from date.
          format: date
          type:
          - string
          - 'null'
        effective_to:
          description: Effective to date.
          format: date
          type:
          - string
          - 'null'
        is_active:
          description: 'Whether this value is active (default: true).'
          type:
          - boolean
          - 'null'
        name:
          description: Dimension value name.
          example: Marketing Department
          type: string
        parent_id:
          description: Parent dimension value ID for hierarchical structure.
          format: uuid
          type:
          - string
          - 'null'
      required:
      - dimension_type_id
      - code
      - name
      type: object
    CreateEntryRequest:
      description: Request body for a single ledger entry.
      properties:
        account_id:
          description: Account ID.
          format: uuid
          type: string
        dimensions:
          description: Dimension value IDs.
          items:
            format: uuid
            type: string
          type: array
        entry_type:
          description: 'Entry type: "debit" or "credit".'
          example: debit
          type: string
        memo:
          description: Optional memo.
          type:
          - string
          - 'null'
        source_amount:
          description: Source amount (positive).
          example: '100.00'
          type: string
        source_currency:
          description: Source currency code.
          example: USD
          type: string
      required:
      - account_id
