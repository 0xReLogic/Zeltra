          $ref: '#/components/schemas/ApiError'

# ============================================================================
# CRITICAL FIX #4: Add pattern validation to amount fields
# ============================================================================
# Location: All schemas with min_amount/max_amount

min_amount:
  description: |
    Minimum amount threshold (inclusive). Must be less than max_amount if both are specified.
    Format: Positive number with up to 2 decimal places.
  type: string
  nullable: true
  pattern: '^[0-9]+(\.[0-9]{1,2})?$'  # ✅ ADD THIS
  example: "1000.00"

max_amount:
  description: |
    Maximum amount threshold (inclusive).
    Format: Positive number with up to 2 decimal places.
  type: string
  nullable: true
  pattern: '^[0-9]+(\.[0-9]{1,2})?$'  # ✅ ADD THIS
  example: "50000.00"

