ApprovalRuleResponse:
  description: Response for an approval rule.
  type: object
  required:
    - id
    - organization_id
    - name
    - transaction_types
    - required_role
    - priority
    - is_active
    - created_at
    - updated_at
  properties:
    id:
      description: Rule ID.
      type: string
      format: uuid
      readOnly: true
      example: "123e4567-e89b-12d3-a456-426614174000"
    organization_id:
      description: Organization ID.
      type: string
      format: uuid
      readOnly: true
      example: "123e4567-e89b-12d3-a456-426614174001"
    name:
      description: Name of the approval rule.
      type: string
      minLength: 1
      maxLength: 255
      example: "High Value Bills"
    description:
      description: Optional description of the rule.
      type: string
      nullable: true
      maxLength: 1000
      example: "Requires approval for bills over $10,000"
    transaction_types:
      description: Transaction types this rule applies to.
      type: array
      items:
        type: string
        enum:
          - bill
          - invoice
          - journal
          - payment
          - expense
          - transfer
      minItems: 1
      maxItems: 10
      example: ["bill"]
    required_role:
      description: Required role to approve transactions matching this rule.
      type: string
      enum:
        - viewer
        - submitter
        - approver
        - accountant
        - admin
        - owner
      example: "approver"
    priority:
      description: Priority level (lower number = higher priority). Valid range 1-100.
      type: integer
      format: int32
      minimum: 1
      maximum: 100
      example: 1
    min_amount:
      description: |
        Minimum amount threshold (inclusive). Must be less than max_amount if both are specified.
        Format: Positive number with up to 2 decimal places.
      type: string
      nullable: true
      pattern: '^[0-9]+(\.[0-9]{1,2})?$'
      example: "1000.00"
    max_amount:
      description: Maximum amount threshold (inclusive). Format: Positive number with up to 2 decimal places.
      type: string
      nullable: true
      pattern: '^[0-9]+(\.[0-9]{1,2})?$'
      example: "50000.00"
    is_active:
      description: Whether the rule is currently active.
      type: boolean
      example: true
    created_at:
      description: Timestamp when the rule was created.
      type: string
      format: date-time
      readOnly: true
      example: "2024-01-15T10:30:00Z"
    updated_at:
      description: Timestamp when the rule was last updated.
      type: string
      format: date-time
      readOnly: true
      example: "2024-01-15T10:30:00Z"

CreateApprovalRuleRequest:
  description: Request body for creating an approval rule.
  type: object
  required:
    - name
    - transaction_types
    - required_role
    - priority
  properties:
    name:
      description: Name of the approval rule.
      type: string
      minLength: 1
      maxLength: 255
      example: "High Value Bills"
    description:
      description: Optional description of the rule.
      type: string
      nullable: true
      maxLength: 1000
      example: "Requires approval for bills over $10,000"
    transaction_types:
      description: Transaction types this rule applies to.
      type: array
      items:
        type: string
        enum:
          - bill
          - invoice
          - journal
          - payment
          - expense
          - transfer
      minItems: 1
      maxItems: 10
      example: ["bill"]
    required_role:
      description: Required role to approve transactions matching this rule.
      type: string
      enum:
        - viewer
        - submitter
        - approver
        - accountant
        - admin
        - owner
      example: "approver"
    priority:
      description: Priority level (lower number = higher priority). Valid range 1-100.
      type: integer
      format: int32
      minimum: 1
      maximum: 100
      example: 1
    min_amount:
      description: |
        Minimum amount threshold (inclusive). Must be less than max_amount if both are specified.
        Format: Positive number with up to 2 decimal places.
      type: string
      nullable: true
      pattern: '^[0-9]+(\.[0-9]{1,2})?$'
      example: "1000.00"
    max_amount:
      description: Maximum amount threshold (inclusive). Format: Positive number with up to 2 decimal places.
      type: string
      nullable: true
      pattern: '^[0-9]+(\.[0-9]{1,2})?$'
      example: "50000.00"
    is_active:
      description: Whether the rule is active (defaults to true if not specified).
      type: boolean
      default: true
      example: true

UpdateApprovalRuleRequest:
  description: |
    Request body for updating an approval rule.
    At least one field must be provided. Set a field to null to clear its value.
  type: object
  minProperties: 1
  properties:
    name:
      description: New name for the rule.
      type: string
      nullable: true
      minLength: 1
      maxLength: 255
      example: "Updated Rule Name"
    description:
      description: New description (set to null to clear).
      type: string
      nullable: true
      maxLength: 1000
    transaction_types:
      description: New transaction types.
      type: array
      nullable: true
      items:
        type: string
        enum:
          - bill
          - invoice
          - journal
          - payment
          - expense
          - transfer
      minItems: 1
      maxItems: 10
    required_role:
      description: New required role.
      type: string
      nullable: true
      enum:
        - viewer
        - submitter
        - approver
        - accountant
        - admin
        - owner
    priority:
      description: New priority level (1-100).
      type: integer
      format: int32
      nullable: true
      minimum: 1
      maximum: 100
    min_amount:
      description: New minimum amount (set to null to clear).
      type: string
      nullable: true
      pattern: '^[0-9]+(\.[0-9]{1,2})?$'
    max_amount:
      description: New maximum amount (set to null to clear).
      type: string
      nullable: true
      pattern: '^[0-9]+(\.[0-9]{1,2})?$'
    is_active:
      description: New active status.
      type: boolean
      nullable: true
