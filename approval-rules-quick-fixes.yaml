# ============================================================================
# CRITICAL FIX #2: Add pagination to list endpoint
# ============================================================================
# Location: GET /organizations/{org_id}/approval-rules

# REPLACE the current response with:
responses:
  '200':
    description: Paginated list of approval rules
    content:
      application/json:
        schema:
          type: object
          required:
            - data
            - meta
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/ApprovalRuleResponse'
            meta:
              $ref: '#/components/schemas/PageMeta'

# ADD these query parameters:
parameters:
  - name: org_id
    in: path
    required: true
    description: Organization ID
    schema:
      type: string
      format: uuid
  - name: page
    in: query
    description: Page number (1-indexed)
    schema:
      type: integer
      format: int32
      default: 1
      minimum: 1
    example: 1
  - name: per_page
    in: query
    description: Items per page
    schema:
      type: integer
      format: int32
      default: 20
      minimum: 1
      maximum: 100
    example: 20
  - name: is_active
    in: query
    description: Filter by active status
    schema:
      type: boolean
    example: true
  - name: transaction_type
    in: query
    description: Filter by transaction type
    schema:
      type: string
      enum: [bill, invoice, journal, payment, expense, transfer]
  - name: sort_by
    in: query
    description: Sort field
    schema:
      type: string
      enum: [priority, created_at, name]
      default: priority
  - name: sort_order
    in: query
    description: Sort order
    schema:
      type: string
      enum: [asc, desc]
      default: asc

