          description: Annual summary.
        cached:
          description: Whether this result was returned from cache.
          type: boolean
        monthly_summary:
          description: Monthly summary for charts.
          items:
            $ref: '#/components/schemas/MonthlySummaryResponse'
          type: array
        parameters_hash:
          description: Hash of simulation parameters for caching.
          type: string
        projections:
          description: Account projections.
          items:
            $ref: '#/components/schemas/AccountProjectionResponse'
          type: array
        simulation_id:
          description: Unique identifier for this simulation run.
          format: uuid
          type: string
      required:
      - simulation_id
      - parameters_hash
      - cached
      - projections
      - annual_summary
      - monthly_summary
      type: object
    ToggleDimensionValueStatusRequest:
      description: Request body for toggling dimension value status.
      properties:
        is_active:
          description: Whether the dimension value should be active.
          type: boolean
      required:
      - is_active
      type: object
    ToggleStatusRequest:
      description: Request body for toggling account status.
      properties:
        is_active:
          description: Whether the account should be active.
          type: boolean
      required:
      - is_active
      type: object
    TransactionListItem:
      description: Response for transaction list item (without entries).
      properties:
        created_at:
          description: Created at timestamp.
          type: string
        description:
          description: Description.
          type: string
        id:
          description: Transaction ID.
          format: uuid
          type: string
        reference_number:
          description: Reference number.
          type:
          - string
          - 'null'
        status:
          description: Status.
          type: string
        transaction_date:
          description: Transaction date.
          type: string
        type:
          description: Transaction type.
          type: string
      required:
      - id
      - type
      - transaction_date
      - description
      - status
      - created_at
      type: object
    TransactionResponse:
      description: Response for a transaction.
      properties:
        created_at:
          description: Created at timestamp.
          type: string
        created_by:
          description: Created by user ID.
          format: uuid
          type: string
        description:
          description: Description.
          type: string
        entries:
          description: Ledger entries.
          items:
            $ref: '#/components/schemas/EntryResponse'
          type: array
        fiscal_period_id:
          description: Fiscal period ID.
          format: uuid
          type: string
        id:
          description: Transaction ID.
          format: uuid
          type: string
        memo:
          description: Memo.
          type:
          - string
          - 'null'
        reference_number:
          description: Reference number.
          type:
          - string
          - 'null'
        status:
          description: Status.
          type: string
        total_credit:
          description: Total credits in functional currency.
          type: string
        total_debit:
          description: Total debits in functional currency.
          type: string
        transaction_date:
          description: Transaction date.
          type: string
        type:
          description: Transaction type.
          type: string
        updated_at:
          description: Updated at timestamp.
          type: string
      required:
      - id
      - type
      - transaction_date
      - description
      - status
      - fiscal_period_id
      - created_by
      - created_at
      - updated_at
      - entries
      - total_debit
      - total_credit
      type: object
    TrialBalanceResponse:
      description: Response for trial balance report.
      properties:
        accounts:
          description: Account balances.
          items:
            $ref: '#/components/schemas/AccountBalanceResponse'
          type: array
        as_of:
          description: As of date.
          example: 2023-12-31
          type: string
        currency:
          description: Currency.
          example: USD
          type: string
        report_type:
          description: Report type.
          example: trial_balance
          type: string
        totals:
          $ref: '#/components/schemas/TrialBalanceTotals'
          description: Totals.
      required:
      - report_type
      - as_of
      - currency
      - accounts
      - totals
      type: object
    TrialBalanceTotals:
      description: Trial balance totals.
      properties:
        is_balanced:
          description: Whether balanced.
          type: boolean
        total_credit:
          description: Total credit.
          type: string
        total_debit:
          description: Total debit.
          type: string
      required:
      - total_debit
      - total_credit
      - is_balanced
      type: object
    UpdateAccountRequest:
      description: Request body for updating an account.
      properties:
        allow_direct_posting:
          description: Whether direct posting is allowed.
          type:
          - boolean
          - 'null'
        code:
          description: Account code.
          type:
          - string
          - 'null'
        description:
          description: Account description.
          type:
          - string
          - 'null'
        is_active:
          description: Whether the account is active.
          type:
          - boolean
          - 'null'
        name:
          description: Account name.
          type:
          - string
          - 'null'
        parent_id:
          description: Parent account ID.
          format: uuid
          type:
          - string
          - 'null'
        subtype:
          description: Account subtype.
          type:
          - string
          - 'null'
        type:
          description: Account type (only if no ledger entries).
          type:
          - string
          - 'null'
      type: object
    UpdateApprovalRuleRequest:
      description: Request body for updating an approval rule.
      properties:
        description:
          description: New description.
          type:
          - string
          - 'null'
        is_active:
          description: Active status.
          type:
          - boolean
          - 'null'
        max_amount:
          description: New maximum amount.
          type:
          - string
          - 'null'
        min_amount:
          description: New minimum amount.
          type:
          - string
          - 'null'
        name:
          description: New name.
          type:
          - string
          - 'null'
        priority:
          description: New priority.
          format: int32
          type:
          - integer
          - 'null'
        required_role:
          description: New required role.
          type:
          - string
          - 'null'
        transaction_types:
          description: New transaction types.
          items:
            type: string
          type:
          - array
          - 'null'
      type: object
    UpdateBudgetRequest:
      description: Request body for updating a budget.
      properties:
        description:
          description: Budget description.
          type:
          - string
          - 'null'
        is_active:
          description: Whether the budget is active.
          type:
          - boolean
          - 'null'
        name:
          description: Budget name.
          type:
          - string
          - 'null'
      type: object
    UpdateDimensionValueRequest:
      description: Request body for updating a dimension value.
      properties:
        code:
          description: Dimension value code.
          type:
          - string
          - 'null'
        description:
          description: Description.
          type:
          - string
          - 'null'
        name:
          description: Dimension value name.
          type:
          - string
          - 'null'
      type: object
    UpdateMemberRequest:
      description: Update organization member request.
      properties:
        approval_limit:
          description: New approval limit (optional, null to clear).
          type:
          - string
          - 'null'
        role:
          description: New role (optional).
          type:
          - string
          - 'null'
      type: object
    UpdateOrganizationRequest:
      description: Update organization request.
      properties:
        base_currency:
          description: Base currency (optional, ISO 4217 code).
          type:
          - string
          - 'null'
        name:
          description: Organization name (optional).
          type:
          - string
          - 'null'
        timezone:
          description: Timezone (optional, IANA format).
          type:
          - string
          - 'null'
      type: object
    UpdatePeriodStatusRequest:
      description: Request body for updating period status.
      properties:
        status:
          description: 'New status: "open", "soft_close", or "closed".'
          example: closed
          type: string
      required:
      - status
      type: object
    UpdateTransactionRequest:
      description: Request body for updating a transaction.
      properties:
        description:
          description: Description.
          type:
          - string
          - 'null'
        memo:
          description: Memo.
          type:
          - string
          - 'null'
        reference_number:
          description: Reference number.
          type:
          - string
          - 'null'
      type: object
    UserInfo:
      description: User info.
      properties:
        full_name:
          description: Full name.
          example: John Doe
          type: string
        id:
          description: User ID.
          format: uuid
          type: string
      required:
      - id
      - full_name
      type: object
    UserOrganization:
      description: Organization info for a user.
      properties:
        id:
          description: Organization ID.
          format: uuid
          type: string
        name:
          description: Organization name.
          type: string
        role:
          description: User's role in this organization.
          type: string
        slug:
          description: Organization slug.
          type: string
      required:
      - id
      - name
      - slug
      - role
      type: object
    VerifyEmailRequest:
      description: Email verification request.
      properties:
        token:
          description: The verification token from the email link.
          type: string
      required:
      - token
      type: object
    VerifyEmailResponse:
      description: Email verification response.
      properties:
        message:
          description: Success message.
          type: string
        verified:
          description: Whether email is now verified.
          type: boolean
      required:
      - message
      - verified
      type: object
    VoidRequest:
      description: Request body for voiding a transaction.
      properties:
        reason:
          description: Void reason (required).
          type: string
      required:
      - reason
      type: object
    VoidResponse:
      description: Response for void operation.
      properties:
        original_transaction:
          $ref: '#/components/schemas/TransactionResponse'
          description: Original transaction (now voided).
        reversing_transaction:
          $ref: '#/components/schemas/TransactionResponse'
          description: Reversing transaction (posted).
      required:
      - original_transaction
      - reversing_transaction
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
info:
  description: HTTP API layer with Axum routes and middleware
  license:
    name: ''
  title: zeltra-api
  version: 0.1.0
openapi: 3.1.0
paths:
  /auth/login:
    post:
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: Login successful
        '401':
          description: Invalid credentials
      summary: POST /auth/login - Authenticate user and return tokens.
      tags:
      - Auth
  /auth/logout:
    post:
      operationId: logout
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      responses:
        '200':
          description: Logged out successfully
      summary: POST /auth/logout - Logout and invalidate refresh token.
      tags:
      - Auth
  /auth/refresh:
    post:
      operationId: refresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: Token refreshed successfully
        '401':
          description: Invalid or expired refresh token
      summary: POST /auth/refresh - Refresh access token using refresh token.
      tags:
      - Auth
  /auth/register:
    post:
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          description: User registered successfully
        '409':
          description: Email already exists
      summary: POST /auth/register - Register a new user.
      tags:
      - Auth
  /auth/resend-verification:
    post:
      operationId: resend_verification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequest'
        required: true
      responses:
        '200':
          description: Verification email sent if account exists
      summary: POST /auth/resend-verification - Resend verification email.
      tags:
      - Auth
  /auth/verify-email:
    post:
      operationId: verify_email
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyEmailResponse'
          description: Email verified successfully
        '400':
          description: Invalid or expired token
      summary: POST /auth/verify-email - Verify user's email with token.
      tags:
      - Auth
  /currencies:
    get:
      operationId: list_currencies
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CurrencyResponse'
                type: array
          description: List of currencies
        '401':
          description: Unauthorized
      security:
      - bearerAuth: []
      summary: GET `/currencies` - List all currencies.
      tags:
      - Currencies
  /health:
    get:
      operationId: health_check
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: Service is healthy
      summary: Health check handler.
      tags:
      - Health
  /organizations:
    post:
      operationId: create_organization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
          description: Organization created successfully
        '409':
          description: Slug already exists
      security:
      - bearerAuth: []
      summary: POST /organizations - Create a new organization.
      tags:
      - Organizations
  /organizations/{org_id}:
    get:
      operationId: get_organization
      parameters:
      - description: Organization ID
        in: path
        name: org_id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
          description: Organization found
        '403':
          description: Forbidden
        '404':
          description: Organization not found
      security:
      - bearerAuth: []
      summary: GET `/organizations/{org_id}` - Get organization details.
      tags:
      - Organizations
    patch:
      operationId: update_organization
      parameters:
      - description: Organization ID
        in: path
        name: org_id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationResponse'
          description: Organization updated successfully
        '403':
          description: Forbidden
        '404':
          description: Organization not found
      security:
      - bearerAuth: []
      summary: PATCH `/organizations/{org_id}` - Update organization settings.
      tags:
      - Organizations
  /organizations/{org_id}/accounts:
    get:
      operationId: list_accounts
      parameters:
      - description: Organization ID
        in: path
        name: org_id
        required: true
        schema:
          format: uuid
          type: string
      - description: Filter by account type.
        in: path
        name: type
        required: true
        schema:
          type:
          - string
          - 'null'
      - description: Filter by active status.
        in: path
        name: active
        required: true
        schema:
          type:
          - boolean
          - 'null'
      - description: Filter by currency.
        in: path
        name: currency
        required: true
        schema:
          type:
          - string
          - 'null'
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AccountResponse'
                type: array
          description: List of accounts
        '403':
          description: Forbidden
      security:
      - bearerAuth: []
      summary: GET `/organizations/{org_id}/accounts` - List accounts with balances.
      tags:
      - Accounts
    post:
      operationId: create_account
      parameters:
      - description: Organization ID
        in: path
        name: org_id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
          description: Account created successfully
        '400':
          description: Invalid input
        '403':
          description: Forbidden
        '409':
          description: Duplicate account code
      security:
      - bearerAuth: []
      summary: POST `/organizations/{org_id}/accounts` - Create an account.
      tags:
      - Accounts
  /organizations/{org_id}/accounts/{account_id}:
    delete:
      operationId: delete_account
      parameters:
      - description: Organization ID
        in: path
        name: org_id
        required: true
        schema:
          format: uuid
          type: string
      - description: Account ID
        in: path
        name: account_id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '204':
          description: Account deleted (deactivated)
        '403':
          description: Forbidden
        '404':
          description: Account not found
        '409':
          description: Cannot delete account with transactions
      security:
      - bearerAuth: []
      summary: DELETE `/organizations/{org_id}/accounts/{account_id}` - Delete (deactivate) account.
      tags:
      - Accounts
    get:
      operationId: get_account
      parameters:
      - description: Organization ID
        in: path
        name: org_id
        required: true
        schema:
          format: uuid
          type: string
      - description: Account ID
        in: path
        name: account_id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
          description: Account details
        '403':
          description: Forbidden
        '404':
          description: Account not found
      security:
      - bearerAuth: []
      summary: GET `/organizations/{org_id}/accounts/{account_id}` - Get account detail.
      tags:
      - Accounts
    put:
      operationId: update_account
      parameters:
      - description: Organization ID
        in: path
        name: org_id
        required: true
        schema:
          format: uuid
          type: string
      - description: Account ID
        in: path
        name: account_id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
          description: Account updated successfully
        '400':
          description: Invalid input
        '403':
          description: Forbidden
        '404':
          description: Account not found
      security:
      - bearerAuth: []
      summary: PUT `/organizations/{org_id}/accounts/{account_id}` - Update account.
      tags:
      - Accounts
  /organizations/{org_id}/accounts/{account_id}/balance:
    get:
      operationId: get_account_balance
      parameters:
      - description: Organization ID
        in: path
        name: org_id
        required: true
        schema:
          format: uuid
          type: string
      - description: Account ID
        in: path
        name: account_id
        required: true
        schema:
          format: uuid
          type: string
      - description: Date to get balance as of (YYYY-MM-DD format). Defaults to today.
        in: path
        name: as_of
        required: true
        schema:
          format: date
          type:
          - string
          - 'null'
      responses:
        '200':
          description: Account balance
        '403':
          description: Forbidden
        '404':
          description: Account not found
      security:
      - bearerAuth: []
      summary: GET `/organizations/{org_id}/accounts/{account_id}/balance` - Get account balance at a specific date.
      tags:
      - Accounts
  /organizations/{org_id}/accounts/{account_id}/ledger:
    get:
      description: 'Requirement 14.4: Account ledger endpoint'
      operationId: get_account_ledger
      parameters:
      - description: Organization ID
        in: path
        name: org_id
        required: true
        schema:
          format: uuid
          type: string
      - description: Account ID
        in: path
        name: account_id
        required: true
        schema:
          format: uuid
          type: string
      - description: Start date.
        in: path
        name: from
        required: true
        schema:
          format: date
          type:
          - string
          - 'null'
      - description: End date.
        in: path
        name: to
        required: true
        schema:
          format: date
          type:
          - string
          - 'null'
      - description: Page number (0-indexed).
        example: 0
        in: path
        name: page
        required: true
        schema:
          format: int64
          minimum: 0
          type:
          - integer
          - 'null'
      - description: Items per page.
        example: 50
        in: path
        name: limit
        required: true
        schema:
          format: int64
          minimum: 0
          type:
          - integer
          - 'null'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountLedgerResponse'
          description: Account ledger report
        '403':
          description: Forbidden
        '404':
          description: Account or organization not found
      security:
      - bearerAuth: []
      summary: GET /organizations/{org_id}/accounts/{account_id}/ledger
      tags:
      - Reports
  /organizations/{org_id}/accounts/{account_id}/status:
    patch:
      operationId: toggle_account_status
      parameters:
      - description: Organization ID
        in: path
        name: org_id
        required: true
        schema:
          format: uuid
          type: string
      - description: Account ID
        in: path
        name: account_id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToggleStatusRequest'
        required: true
      responses:
        '200':
          description: Status toggled successfully
        '403':
          description: Forbidden
        '404':
          description: Account not found
      security:
      - bearerAuth: []
      summary: PATCH `/organizations/{org_id}/accounts/{account_id}/status` - Toggle account status.
      tags:
      - Accounts
  /organizations/{org_id}/approval-rules:
    get:
      operationId: list_approval_rules
      parameters:
      - description: Organization ID
        in: path
        name: org_id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ApprovalRuleResponse'
                type: array
          description: List of approval rules
        '403':
          description: Forbidden
      security:
      - bearerAuth: []
      summary: GET `/organizations/{org_id}/approval-rules` - List approval rules.
      tags:
      - Approval Rules
    post:
      operationId: create_approval_rule
      parameters:
      - description: Organization ID
        in: path
        name: org_id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApprovalRuleRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalRuleResponse'
          description: Approval rule created successfully
        '400':
          description: Invalid input or amount format
        '403':
          description: Forbidden
      security:
      - bearerAuth: []
      summary: POST `/organizations/{org_id}/approval-rules` - Create approval rule.
      tags:
      - Approval Rules
  /organizations/{org_id}/approval-rules/{rule_id}:
    delete:
      operationId: delete_approval_rule
      parameters:
      - description: Organization ID
        in: path
        name: org_id
        required: true
        schema:
          format: uuid
          type: string
