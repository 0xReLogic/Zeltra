components:
  schemas:
    ApprovalRuleResponse:
      description: Response for an approval rule.
      properties:
        created_at:
          description: Created at timestamp.
          type: string
        description:
          description: Description.
          type: string
          nullable: true
        id:
          description: Rule ID.
          format: uuid
          type: string
        is_active:
          description: Active status.
          type: boolean
        max_amount:
          description: Maximum amount threshold.
          type: string
          nullable: true
        min_amount:
          description: Minimum amount threshold.
          type: string
          nullable: true
        name:
          description: Name.
          type: string
        organization_id:
          description: Organization ID.
          format: uuid
          type: string
        priority:
          description: Priority.
          format: int32
          type: integer
        required_role:
          description: Required role.
          type: string
        transaction_types:
          description: Transaction types.
          items:
            type: string
          type: array
        updated_at:
          description: Updated at timestamp.
          type: string
      required:
      - id
      - organization_id
      - name
      - transaction_types
      - required_role
      - priority
      - is_active
      - created_at
      - updated_at
      type: object
    CreateApprovalRuleRequest:
      description: Request body for creating an approval rule.
      properties:
        description:
          description: Optional description.
          type: string
          nullable: true
        max_amount:
          description: Maximum amount threshold (inclusive).
          type: string
          nullable: true
        min_amount:
          description: Minimum amount threshold (inclusive).
          example: '1000.00'
          type: string
          nullable: true
        name:
          description: Name of the approval rule.
          example: High Value Bills
          type: string
        priority:
          description: Priority (lower = higher priority).
          example: 1
          format: int32
          type: integer
        required_role:
          description: Required role to approve (viewer, submitter, approver, accountant,
            admin, owner).
          example: approver
          type: string
        transaction_types:
          description: Transaction types this rule applies to.
          example: '["bill"]'
          items:
            type: string
          type: array
      required:
      - name
      - transaction_types
      - required_role
      - priority
      type: object
    UpdateApprovalRuleRequest:
      description: Request body for updating an approval rule.
      properties:
        description:
          description: New description.
          type: string
          nullable: true
        is_active:
          description: Active status.
          type: boolean
          nullable: true
        max_amount:
          description: New maximum amount.
          type: string
          nullable: true
        min_amount:
          description: New minimum amount.
          type: string
          nullable: true
        name:
          description: New name.
          type: string
          nullable: true
        priority:
          description: New priority.
          format: int32
          type: integer
          nullable: true
        required_role:
          description: New required role.
          type: string
          nullable: true
        transaction_types:
          description: New transaction types.
          items:
            type: string
          type: array
          nullable: true
      type: object
